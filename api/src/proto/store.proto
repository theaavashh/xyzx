syntax = "proto3";

package rapharch.store;

import "common.proto";
import "cms.proto";

service CategoryService {
  rpc GetCategories(common.PaginationRequest) returns (ListCategoriesResponse);
  rpc GetCategoriesHierarchy(common.Empty) returns (ListCategoriesResponse);
  rpc GetCategoryById(cms.GetByIdRequest) returns (CategoryResponse);
  rpc GetCategoryBySlug(cms.GetBySlugRequest) returns (CategoryResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (CategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (CategoryResponse);
  rpc DeleteCategory(cms.GetByIdRequest) returns (common.ApiResponse);
  rpc ToggleCategoryStatus(cms.GetByIdRequest) returns (CategoryResponse);
}

service CartService {
  rpc GetCart(GetCartRequest) returns (CartResponse);
  rpc AddToCart(AddToCartRequest) returns (CartResponse);
  rpc UpdateCartItem(UpdateCartItemRequest) returns (CartResponse);
  rpc RemoveCartItem(RemoveCartItemRequest) returns (CartResponse);
  rpc ClearCart(ClearCartRequest) returns (CartResponse);
}

service NavigationService {
  rpc GetNavigationItems(common.Empty) returns (ListNavigationItemsResponse);
  rpc GetAllNavigationItems(common.Empty) returns (ListNavigationItemsResponse);
  rpc GetNavigationItemById(cms.GetByIdRequest) returns (NavigationItemResponse);
  rpc CreateNavigationItem(CreateNavigationItemRequest) returns (NavigationItemResponse);
  rpc UpdateNavigationItem(UpdateNavigationItemRequest) returns (NavigationItemResponse);
  rpc DeleteNavigationItem(cms.GetByIdRequest) returns (common.ApiResponse);
  rpc ToggleNavigationItemStatus(cms.GetByIdRequest) returns (NavigationItemResponse);
  rpc ReorderNavigationItems(cms.ReorderRequest) returns (common.ApiResponse);
}

service FooterCatalogService {
  rpc GetFooterCatalogs(common.Empty) returns (ListFooterCatalogsResponse);
  rpc GetAllFooterCatalogs(common.Empty) returns (ListFooterCatalogsResponse);
  rpc GetFooterCatalogById(cms.GetByIdRequest) returns (FooterCatalogResponse);
  rpc CreateFooterCatalog(CreateFooterCatalogRequest) returns (FooterCatalogResponse);
  rpc UpdateFooterCatalog(UpdateFooterCatalogRequest) returns (FooterCatalogResponse);
  rpc DeleteFooterCatalog(cms.GetByIdRequest) returns (common.ApiResponse);
  rpc ToggleFooterCatalogStatus(cms.GetByIdRequest) returns (FooterCatalogResponse);
  rpc ReorderFooterCatalogs(cms.ReorderRequest) returns (common.ApiResponse);
}

service FooterSectionService {
  rpc GetFooterSections(common.Empty) returns (ListFooterSectionsResponse);
  rpc GetAllFooterSections(common.Empty) returns (ListFooterSectionsResponse);
  rpc GetFooterSectionById(cms.GetByIdRequest) returns (FooterSectionResponse);
  rpc CreateFooterSection(CreateFooterSectionRequest) returns (FooterSectionResponse);
  rpc UpdateFooterSection(UpdateFooterSectionRequest) returns (FooterSectionResponse);
  rpc DeleteFooterSection(cms.GetByIdRequest) returns (common.ApiResponse);
  rpc ToggleFooterSectionStatus(cms.GetByIdRequest) returns (FooterSectionResponse);
  rpc ReorderFooterSections(cms.ReorderRequest) returns (common.ApiResponse);
}

service ShopByCategoryService {
  rpc GetActiveShopByCategories(common.Empty) returns (ListShopByCategoriesResponse);
  rpc GetAllShopByCategories(common.Empty) returns (ListShopByCategoriesResponse);
  rpc GetShopByCategoryById(cms.GetByIdRequest) returns (ShopByCategoryResponse);
  rpc CreateShopByCategory(CreateShopByCategoryRequest) returns (ShopByCategoryResponse);
  rpc UpdateShopByCategory(UpdateShopByCategoryRequest) returns (ShopByCategoryResponse);
  rpc DeleteShopByCategory(cms.GetByIdRequest) returns (common.ApiResponse);
  rpc ToggleShopByCategoryStatus(cms.GetByIdRequest) returns (ShopByCategoryResponse);
  rpc ReorderShopByCategories(cms.ReorderRequest) returns (common.ApiResponse);
}

service StoreService {
  rpc GetPublicStore(common.Empty) returns (StoreResponse);
  rpc GetStore(common.Empty) returns (StoreResponse);
  rpc UpdateStore(UpdateStoreRequest) returns (StoreResponse);
  rpc ToggleStoreStatus(common.Empty) returns (StoreResponse);
}

message GetCartRequest { string sessionId = 1; string userId = 2; }
message AddToCartRequest { string sessionId = 1; string userId = 2; string productId = 3; int32 quantity = 4; string size = 5; string color = 6; }
message UpdateCartItemRequest { string itemId = 1; int32 quantity = 2; string sessionId = 3; string userId = 4; }
message RemoveCartItemRequest { string itemId = 1; string sessionId = 2; string userId = 3; }
message ClearCartRequest { string sessionId = 1; string userId = 2; }

message CreateCategoryRequest { string name = 1; string slug = 2; string image = 3; string internalLink = 4; string metaTitle = 5; string metaDescription = 6; string keywords = 7; }
message UpdateCategoryRequest { string id = 1; string name = 2; string slug = 3; string image = 4; string internalLink = 5; bool isActive = 6; string metaTitle = 7; string metaDescription = 8; string keywords = 9; }

message CreateNavigationItemRequest { string name = 1; string href = 2; int32 order = 3; bool isActive = 4; string columns = 5; }
message UpdateNavigationItemRequest { string id = 1; string name = 2; string href = 3; int32 order = 4; bool isActive = 5; string columns = 6; }

message CreateFooterCatalogRequest { string title = 1; string href = 2; int32 order = 3; bool isActive = 4; string links = 5; }
message UpdateFooterCatalogRequest { string id = 1; string title = 2; string href = 3; int32 order = 4; bool isActive = 5; string links = 6; }

message CreateFooterSectionRequest { string title = 1; int32 order = 2; bool isActive = 3; string links = 4; }
message UpdateFooterSectionRequest { string id = 1; string title = 2; int32 order = 3; bool isActive = 4; string links = 5; }

message CreateShopByCategoryRequest { string title = 1; string image = 2; string link = 3; int32 order = 4; bool isActive = 5; }
message UpdateShopByCategoryRequest { string id = 1; string title = 2; string image = 3; string link = 4; int32 order = 5; bool isActive = 6; }

message UpdateStoreRequest { string title = 1; string subtitle = 2; string description = 3; string address = 4; string city = 5; string state = 6; string zip = 7; string country = 8; string phone = 9; string email = 10; string image = 11; string mapEmbedUrl = 12; string ctaText = 13; string ctaUrl = 14; string hours = 15; bool isActive = 16; }

message Category { string id = 1; string name = 2; string slug = 3; string image = 4; bool isActive = 5; string createdAt = 6; string updatedAt = 7; }
message CartItem { string id = 1; string productId = 2; string productName = 3; double price = 4; int32 quantity = 5; string size = 6; string color = 7; string image = 8; }
message Cart { string id = 1; string sessionId = 2; string userId = 3; repeated CartItem items = 4; double total = 5; string createdAt = 6; string updatedAt = 7; }
message NavigationItem { string id = 1; string name = 2; string href = 3; int32 order = 4; bool isActive = 5; string columns = 6; string createdAt = 7; string updatedAt = 8; }
message FooterCatalog { string id = 1; string title = 2; string href = 3; int32 order = 4; bool isActive = 5; string links = 6; string createdAt = 7; string updatedAt = 8; }
message FooterSection { string id = 1; string title = 2; int32 order = 3; bool isActive = 4; string links = 5; string createdAt = 6; string updatedAt = 7; }
message ShopByCategory { string id = 1; string title = 2; string image = 3; string link = 4; int32 order = 5; bool isActive = 6; string createdAt = 7; string updatedAt = 8; }
message Store { string id = 1; string title = 2; string subtitle = 3; string description = 4; string address = 5; string city = 6; string state = 7; string zip = 8; string country = 9; string phone = 10; string email = 11; string image = 12; string mapEmbedUrl = 13; string ctaText = 14; string ctaUrl = 15; string hours = 16; bool isActive = 17; string createdAt = 18; string updatedAt = 19; }

message CategoryResponse { bool success = 1; string message = 2; Category data = 3; common.Error error = 4; }
message ListCategoriesResponse { bool success = 1; string message = 2; repeated Category data = 3; common.Pagination pagination = 4; common.Error error = 5; }
message CartResponse { bool success = 1; string message = 2; Cart data = 3; common.Error error = 4; }
message NavigationItemResponse { bool success = 1; string message = 2; NavigationItem data = 3; common.Error error = 4; }
message ListNavigationItemsResponse { bool success = 1; string message = 2; repeated NavigationItem data = 3; common.Pagination pagination = 4; common.Error error = 5; }
message FooterCatalogResponse { bool success = 1; string message = 2; FooterCatalog data = 3; common.Error error = 4; }
message ListFooterCatalogsResponse { bool success = 1; string message = 2; repeated FooterCatalog data = 3; common.Pagination pagination = 4; common.Error error = 5; }
message FooterSectionResponse { bool success = 1; string message = 2; FooterSection data = 3; common.Error error = 4; }
message ListFooterSectionsResponse { bool success = 1; string message = 2; repeated FooterSection data = 3; common.Pagination pagination = 4; common.Error error = 5; }
message ShopByCategoryResponse { bool success = 1; string message = 2; ShopByCategory data = 3; common.Error error = 4; }
message ListShopByCategoriesResponse { bool success = 1; string message = 2; repeated ShopByCategory data = 3; common.Pagination pagination = 4; common.Error error = 5; }
message StoreResponse { bool success = 1; string message = 2; Store data = 3; common.Error error = 4; }
